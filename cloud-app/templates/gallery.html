<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея </title>
    <style>
        :root {
            --bg: #111827;
            --surface: #1f2937;
            --surface-hover: #374151;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
            --border: #374151;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --accent: #3b82f6;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .gallery-container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo small {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: var(--radius-sm);
            background: var(--surface);
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform var(--transition), box-shadow var(--transition);
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Лайтбокс (полный экран) */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active { display: flex; }

        .lightbox .image-wrapper {
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            -webkit-user-drag: none;
        }

        /* Водяной знак-сетка */
        .watermark-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 80px,
                rgba(255, 255, 255, 0.02) 80px,
                rgba(255, 255, 255, 0.02) 82px
            );
            pointer-events: none;
        }
        /* #обязательное наложение еле заметной ватермарки 
        .watermark-overlay::before { 
            content: var(--watermark); # исходя из данных в aboutPhotograph.json
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            color: rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            letter-spacing: 12px;
            font-weight: bold;
        }
        */
        .lightbox .close,
        .lightbox .nav,
        .lightbox .fullscreen-btn {
            z-index: 20;
            color: white;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity var(--transition);
            background: none;
            border: none;
            font-size: 40px;
            line-height: 1;
            padding: 10px;
            user-select: none;
        }

        .lightbox .close { position: absolute; top: 20px; right: 40px; }
        .lightbox .nav { font-size: 60px; padding: 0 20px; position: absolute; top: 50%; transform: translateY(-50%); }
        .lightbox .nav.prev { left: 20px; }
        .lightbox .nav.next { right: 20px; }
        .lightbox .fullscreen-btn { position: absolute; bottom: 30px; right: 40px; font-size: 36px; }

        .lightbox .close:hover,
        .lightbox .nav:hover,
        .lightbox .fullscreen-btn:hover { opacity: 1; }

        .lightbox .caption {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
            z-index: 20;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            background: var(--surface);
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false" oncopy="return false">
    <div class="gallery-container">
        <div class="header">
            <div class="logo">
                <h1>📷 Фото для просмотра</h1>
            </div>
        </div>

        <div id="galleryGrid" class="gallery-grid">Загрузка...</div>
    </div>

    <!-- Модальное окно для проверки пароля -->
    <div id="passwordModal" class="lightbox" style="display: flex;">
        <div style="background: var(--surface); border-radius: var(--radius); padding: 32px; max-width: 400px; margin: auto; text-align: center; border: 1px solid var(--border);">
            <h2 style="margin-bottom: 16px; color: var(--text);">🔒 Введите пароль</h2>
            <p id="passwordError" style="color: var(--danger); margin-bottom: 16px; min-height: 20px;"></p>
            <form onsubmit="submitPassword(event)" style="display: flex; flex-direction: column; gap: 16px;">
                <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off"
                       style="padding: 12px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--input-text); border-radius: var(--radius-sm); font-size: 1rem; outline: none;">
                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-accent" style="flex: 1;">✅ Подтвердить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Лайтбокс -->
    <div id="lightbox" class="lightbox" oncontextmenu="return false">
        <button class="close" onclick="closeLightbox()">&times;</button>
        <button class="nav prev" onclick="changeImage(-1)">&#10094;</button>
        <div class="image-wrapper">
            <img id="lightboxImg" src="" alt="" oncontextmenu="return false">
            <div class="watermark-overlay"></div>
        </div>
        <button class="nav next" onclick="changeImage(1)">&#10095;</button>
        <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Во весь экран">⛶</button>
        <div class="caption" id="lightboxCaption"></div>
    </div>

    <footer id="footer">
        <p id="footerContact"></p>
        <p id="footerCopyright"></p>
    </footer>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.key === 's') ||
                (e.ctrlKey && e.key === 'u') ||
                (e.ctrlKey && e.key === 'p')) {
                e.preventDefault();
                return false;
            }
        });

        const folder = "{{ folder }}";
        const token = "{{ token }}";
        let images = [];
        let passwordVerified = false;

        async function submitPassword(event) {
            event.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');

            try {
                const formData = new FormData();
                formData.append('token', token);
                formData.append('password', password);
                const response = await fetch('/verify-password', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.blocked) {
                    errorDiv.textContent = '❌ Доступ заблокирован после 5 неправильных попыток';
                    return;
                }

                if (data.success) {
                    passwordVerified = true;
                    document.getElementById('passwordModal').style.display = 'none';
                    loadFooterData();
                    loadGallery();
                } else {
                    const attemptsLeft = data.attempts_left || 0;
                    if (attemptsLeft > 0) {
                        errorDiv.textContent = `❌ Неправильный пароль. Осталось попыток: ${attemptsLeft}`;
                    } else {
                        errorDiv.textContent = '❌ Доступ заблокирован после 5 неправильных попыток';
                    }
                    document.getElementById('passwordInput').value = '';
                }
            } catch (error) {
                errorDiv.textContent = '❌ Ошибка при проверке пароля';
            }
        }

        async function checkPasswordRequired() {
            try {
                const formData = new FormData();
                formData.append('token', token);
                formData.append('password', '');
                const response = await fetch('/verify-password', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.blocked) {
                    document.getElementById('passwordModal').innerHTML = `
                        <div style="background: var(--surface); border-radius: var(--radius); padding: 32px; max-width: 400px; margin: auto; text-align: center; border: 1px solid var(--border);">
                            <h2 style="margin-bottom: 16px; color: var(--danger);">🔒 Доступ заблокирован</h2>
                            <p style="color: var(--text); margin-bottom: 16px;">Этот токен был заблокирован после 5 неправильных попыток ввода пароля.</p>
                        </div>
                    `;
                    return;
                }

                if (data.success) {
                    // Пароль не требуется
                    passwordVerified = true;
                    document.getElementById('passwordModal').style.display = 'none';
                    loadFooterData();
                    loadGallery();
                } else {
                    // Требуется пароль
                    document.getElementById('passwordModal').style.display = 'flex';
                    document.getElementById('passwordInput').focus();
                }
            } catch (error) {
                console.error('Ошибка проверки пароля:', error);
                loadFooterData();
                loadGallery();
            }
        }

        async function loadFooterData() {
            try {
                const res = await fetch('/static/aboutPhotograph.json');
                const data = await res.json();
                const { photographer, contact, portfolio } = data;
                
                // Заполняем контактную информацию
                document.getElementById('footerContact').innerText = 
                    `${photographer.icon} ${photographer.name} | ${contact.phone} | ${contact.email}`;
                
                // Заполняем авторские права
                document.getElementById('footerCopyright').innerText = 
                    `© ${portfolio.year} ${portfolio.title}. ${portfolio.copyright}`;
            } catch (error) {
                console.error('Ошибка загрузки данных футера:', error);
            }
        }

        async function loadGallery() {
            try {
                const res = await fetch(`/list?folder=${encodeURIComponent(folder)}`);
                const files = await res.json();
                images = files.filter(f => f.is_image);
                const grid = document.getElementById('galleryGrid');
                if (images.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-secondary); padding: 20px;">В этой галерее пока нет изображений.</p>';
                    return;
                }
                grid.innerHTML = images.map((img, idx) => {
                    const thumbUrl = `/secure-preview/${encodeURIComponent(folder)}/${encodeURIComponent(img.filename)}?token=${encodeURIComponent(token)}`;
                    return `
                        <div class="gallery-item" onclick="openLightbox(${idx})" oncontextmenu="return false">
                            <img src="${thumbUrl}" alt="${img.original_name || img.filename}" draggable="false">
                        </div>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('galleryGrid').innerHTML = '<p style="color: var(--text-secondary);">Ошибка загрузки галереи</p>';
            }
        }

        let currentIdx = 0;
        function openLightbox(idx) {
            currentIdx = idx;
            const img = images[idx];
            document.getElementById('lightboxImg').src =
                `/secure-preview/${encodeURIComponent(folder)}/${encodeURIComponent(img.filename)}?token=${encodeURIComponent(token)}`;
            document.getElementById('lightboxCaption').innerText = img.original_name || img.filename;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        function changeImage(delta) {
            currentIdx = (currentIdx + delta + images.length) % images.length;
            const img = images[currentIdx];
            document.getElementById('lightboxImg').src =
                `/secure-preview/${encodeURIComponent(folder)}/${encodeURIComponent(img.filename)}?token=${encodeURIComponent(token)}`;
            document.getElementById('lightboxCaption').innerText = img.original_name || img.filename;
        }

        function toggleFullscreen() {
            const lightbox = document.getElementById('lightbox');
            if (!document.fullscreenElement) {
                if (lightbox.requestFullscreen) lightbox.requestFullscreen();
                else if (lightbox.webkitRequestFullscreen) lightbox.webkitRequestFullscreen();
                else if (lightbox.msRequestFullscreen) lightbox.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (!lb.classList.contains('active')) return;
            if (e.key === 'Escape') { closeLightbox(); e.preventDefault(); }
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
        });

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        // Проверяем требуется ли пароль
        checkPasswordRequired();
    </script>
</body>
</html>
