<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Галерея — Портфолио </title>
    <style>
        :root {
            --bg: #111827;
            --surface: #1f2937;
            --surface-hover: #374151;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
            --border: #374151;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --accent: #3b82f6;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .gallery-container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .logo h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo small {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: var(--radius-sm);
            background: var(--surface);
            position: relative;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform var(--transition), box-shadow var(--transition);
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }

        /* Лайтбокс (полный экран) */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 2000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lightbox.active { display: flex; }

        .lightbox .image-wrapper {
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
            -webkit-user-drag: none;
            user-drag: none;
        }

        /* Водяной знак-сетка */
        .watermark-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 80px,
                rgba(255, 255, 255, 0.02) 80px,
                rgba(255, 255, 255, 0.02) 82px
            );
            pointer-events: none;
        }

        .watermark-overlay::before {
            content: "Shorokhovv";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 8vw;
            color: rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            letter-spacing: 12px;
            font-weight: bold;
        }

        .lightbox .close,
        .lightbox .nav,
        .lightbox .fullscreen-btn {
            z-index: 20;
            color: white;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity var(--transition);
            background: none;
            border: none;
            font-size: 40px;
            line-height: 1;
            padding: 10px;
            user-select: none;
        }

        .lightbox .close { position: absolute; top: 20px; right: 40px; }
        .lightbox .nav { font-size: 60px; padding: 0 20px; position: absolute; top: 50%; transform: translateY(-50%); }
        .lightbox .nav.prev { left: 20px; }
        .lightbox .nav.next { right: 20px; }
        .lightbox .fullscreen-btn { position: absolute; bottom: 30px; right: 40px; font-size: 36px; }

        .lightbox .close:hover,
        .lightbox .nav:hover,
        .lightbox .fullscreen-btn:hover { opacity: 1; }

        .lightbox .caption {
            color: var(--text-secondary);
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
            z-index: 20;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            background: var(--surface);
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body oncontextmenu="return false" ondragstart="return false" oncopy="return false">
    <div class="gallery-container">
        <div class="header">
            <div class="logo">
                <h1>📷 Портфолио</h1>
                <small>Галерея доступна только для просмотра</small>
            </div>
        </div>

        <div id="galleryGrid" class="gallery-grid">Загрузка...</div>
    </div>

    <!-- Лайтбокс -->
    <div id="lightbox" class="lightbox" oncontextmenu="return false">
        <button class="close" onclick="closeLightbox()">&times;</button>
        <button class="nav prev" onclick="changeImage(-1)">&#10094;</button>
        <div class="image-wrapper">
            <img id="lightboxImg" src="" alt="" oncontextmenu="return false">
            <div class="watermark-overlay"></div>
        </div>
        <button class="nav next" onclick="changeImage(1)">&#10095;</button>
        <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Во весь экран">⛶</button>
        <div class="caption" id="lightboxCaption"></div>
    </div>

    <footer>
        <p>📷 Shorokhovv | +7 (999) 123-45-67 | photo@example.com</p>
        <p>© 2025 Портфолио. Все права защищены.</p>
    </footer>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.key === 's') ||
                (e.ctrlKey && e.key === 'u') ||
                (e.ctrlKey && e.key === 'p')) {
                e.preventDefault();
                return false;
            }
        });

        const folder = "{{ folder }}";
        const token = "{{ token }}";
        let images = [];

        async function loadGallery() {
            try {
                const res = await fetch(`/list?folder=${encodeURIComponent(folder)}`);
                const files = await res.json();
                images = files.filter(f => f.is_image);
                const grid = document.getElementById('galleryGrid');
                if (images.length === 0) {
                    grid.innerHTML = '<p style="color: var(--text-secondary); padding: 20px;">В этой галерее пока нет изображений.</p>';
                    return;
                }
                grid.innerHTML = images.map((img, idx) => {
                    const thumbUrl = `/secure-preview/${encodeURIComponent(folder)}/${encodeURIComponent(img.filename)}?token=${encodeURIComponent(token)}`;
                    return `
                        <div class="gallery-item" onclick="openLightbox(${idx})" oncontextmenu="return false">
                            <img src="${thumbUrl}" alt="${img.original_name || img.filename}" draggable="false">
                        </div>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('galleryGrid').innerHTML = '<p style="color: var(--text-secondary);">Ошибка загрузки галереи</p>';
            }
        }

        let currentIdx = 0;
        function openLightbox(idx) {
            currentIdx = idx;
            const img = images[idx];
            document.getElementById('lightboxImg').src =
                `/secure-preview/${encodeURIComponent(folder)}/${encodeURIComponent(img.filename)}?token=${encodeURIComponent(token)}`;
            document.getElementById('lightboxCaption').innerText = img.original_name || img.filename;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        function changeImage(delta) {
            currentIdx = (currentIdx + delta + images.length) % images.length;
            const img = images[currentIdx];
            document.getElementById('lightboxImg').src =
                `/secure-preview/${encodeURIComponent(folder)}/${encodeURIComponent(img.filename)}?token=${encodeURIComponent(token)}`;
            document.getElementById('lightboxCaption').innerText = img.original_name || img.filename;
        }

        function toggleFullscreen() {
            const lightbox = document.getElementById('lightbox');
            if (!document.fullscreenElement) {
                if (lightbox.requestFullscreen) lightbox.requestFullscreen();
                else if (lightbox.webkitRequestFullscreen) lightbox.webkitRequestFullscreen();
                else if (lightbox.msRequestFullscreen) lightbox.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            const lb = document.getElementById('lightbox');
            if (!lb.classList.contains('active')) return;
            if (e.key === 'Escape') { closeLightbox(); e.preventDefault(); }
            if (e.key === 'ArrowLeft') changeImage(-1);
            if (e.key === 'ArrowRight') changeImage(1);
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
        });

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });

        loadGallery();
    </script>
</body>
</html>
